<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead Maze Trade Calculator</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<style>
  /* Top right navigation links */
  .top-nav {
    position: fixed;
    top: 14px;
    right: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    font-family: Arial, sans-serif;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 14px;
    border-radius: 6px;
    z-index: 9999;
    pointer-events: none;
  }

  .top-nav a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    pointer-events: auto;
  }

  .top-nav a:hover {
    color: rgba(255, 255, 255, 1);
  }

  .top-nav .active {
    color: #fff;
    font-weight: bold;
  }

  .top-nav .separator {
    color: rgba(255, 255, 255, 0.3);
    margin: 0 6px;
  }

  .footer {
    position: fixed;
    bottom: 10px;
    left: 14px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 14px;
    font-family: Arial, sans-serif;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 10px;
    border-radius: 6px;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>
<br>
<h2>Dead Maze Trade Calculator</h2>
<div class="glass-container">
  <div class="offer">
    <h3># Offer 1</h3>
    <div id="leftRowsContainer"></div> 
    <button type="button" class="addKitBtn" onclick="addKitRow('leftRowsContainer')">+ Add Item</button>
    <input id="leftValue" type="text" readonly placeholder="Value" />
  </div>
  <div class="offer">
    <h3># Offer 2</h3>
    <div id="rightRowsContainer"></div> 
    <button type="button" class="addKitBtn" onclick="addKitRow('rightRowsContainer')">+ Add Item</button>
    <input id="rightValue" type="text" readonly placeholder="Value" />
  </div>
</div>
<div id="toastContainer"></div>
<div class="review-section">
  <div id="leftIcons" class="icon-group left"></div>
  <button class="reviewBtn" onclick="reviewTrade()">Compare</button>
  <div id="rightIcons"  class="icon-group right"></div>
</div>
<br><br>

<div class="top-nav">
  <span class="active">Trade Calculator</span>
  <span class="separator">|</span>
  <a href="trade-lookup.html">Trade Lookup</a>
</div>

<div class="footer">Made by Rapidegaming#0915</div>

<script src="main.js"></script>
</body>
</html>
