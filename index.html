<!--index.html-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead Maze Trade Calculator</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<style>
  /* Warning banner - top left corner */
  .warning-banner {
    position: fixed;
    bottom: 14px;
    right: 20px;
    color: #ffffff;
    font-size: 13px;
    font-family: Arial, sans-serif;
    background: #d79e00;
    padding: 5px 14px;
    border-radius: 6px;
    z-index: 9999;
    pointer-events: none;
    border: 1px solid rgba(255, 193, 7, 0.5);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .warning-banner svg {
    flex-shrink: 0;
  }

  /* Top right navigation links */
  .top-nav {
    position: fixed;
    top: 14px;
    right: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    font-family: Arial, sans-serif;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 14px;
    border-radius: 6px;
    z-index: 9999;
    pointer-events: none;
  }

  .top-nav a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    pointer-events: auto;
  }

  .top-nav a:hover {
    color: rgba(255, 255, 255, 1);
  }

  .top-nav .active {
    color: #fff;
    font-weight: bold;
  }

  .top-nav .separator {
    color: rgba(255, 255, 255, 0.3);
    margin: 0 6px;
  }

  .footer {
    position: fixed;
    bottom: 10px;
    left: 14px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 14px;
    font-family: Arial, sans-serif;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 10px;
    border-radius: 6px;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="warning-banner">
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
  <line x1="12" y1="9" x2="12" y2="13"/>
  <line x1="12" y1="17" x2="12.01" y2="17"/>
</svg>
  <strong>Values may vary; some may require corrections.</strong>
</div>    

<br>
<h2>Dead Maze Trade Calculator</h2>
<div class="glass-container">
  <div class="offer">
    <h3># Offer 1</h3>
    <div id="leftRowsContainer"></div> 
    <button type="button" class="addKitBtn" onclick="addKitRow('leftRowsContainer')">+ Add Item</button>
    <input id="leftValue" type="text" readonly placeholder="Value" />
  </div>
  <div class="offer">
    <h3># Offer 2</h3>
    <div id="rightRowsContainer"></div> 
    <button type="button" class="addKitBtn" onclick="addKitRow('rightRowsContainer')">+ Add Item</button>
    <input id="rightValue" type="text" readonly placeholder="Value" />
  </div>
</div>
<div id="toastContainer"></div>
<div class="review-section">
  <div id="leftIcons" class="icon-group left"></div>
  <button class="reviewBtn" onclick="reviewTrade()">Compare</button>
  <div id="rightIcons"  class="icon-group right"></div>
</div>
<br><br>

<div class="top-nav">
  <span class="active">Trade Calculator</span>
  <span class="separator">|</span>
  <a href="trade-lookup.html">Trade Lookup</a>
</div>

<div class="footer">Made by Rapidegaming#0915</div>

<script src="main.js"></script>
</body>
</html>
